<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" xml:space="preserve">
<defs>
  <style type="text/css">
    .node { animation: pulse 2.5s ease-in-out infinite; }
    .node-delay { animation-delay: 0.8s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
  </style>
</defs>
<rect width="30" height="30" rx="6" fill="#0C1028"/>
<circle class="node" cx="7" cy="15" r="2.5" fill="#6C63FF"/>
<circle class="node" cx="15" cy="8" r="2.5" fill="#00F5FF"/>
<circle class="node" cx="23" cy="15" r="2.5" fill="#6C63FF"/>
<circle class="node node-delay" cx="15" cy="22" r="2" fill="#B84DFF"/>
<line x1="7" y1="15" x2="15" y2="8" stroke="#6C63FF" stroke-width="1.2" opacity="0.7"/>
<line x1="15" y1="8" x2="23" y2="15" stroke="#00F5FF" stroke-width="1.2" opacity="0.7"/>
<line x1="7" y1="15" x2="23" y2="15" stroke="#6C63FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
<line x1="15" y1="8" x2="15" y2="22" stroke="#B84DFF" stroke-width="1" opacity="0.4"/>
<line x1="7" y1="15" x2="15" y2="22" stroke="#B84DFF" stroke-width="1" opacity="0.3"/>
<line x1="23" y1="15" x2="15" y2="22" stroke="#B84DFF" stroke-width="1" opacity="0.3"/>
</svg>
